<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500">
  <defs>
    <linearGradient id="pfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="pfSh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1100" height="500" fill="url(#pfBg)" rx="16"/>

  <!-- Title -->
  <text x="550" y="28" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="700">METHANOL PRODUCTION - COMPLETE PLANT PROCESS FLOW</text>

  <!-- Recycle loop (behind equipment) -->
  <path d="M 990,105 L 990,72 Q 990,60 970,60 L 630,60 Q 610,60 610,72 L 610,105" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="604,103 610,115 616,103" fill="#f59e0b"/>
  <rect x="730" y="48" width="170" height="22" rx="9" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="815" y="63" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="600">Recycle Loop RR=3.5</text>

  <!-- Purge (up from recycle) -->
  <line x1="920" y1="60" x2="920" y2="22" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="914,26 920,14 926,26" fill="#ef4444"/>
  <text x="890" y="14" font-family="sans-serif" font-size="9" fill="#f87171">Purge</text>

  <!-- === ROW 1: Main process (y=110 center) === -->

  <!-- Natural Gas -->
  <g transform="translate(20, 90)">
    <rect width="100" height="46" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#pfSh)"/>
    <text x="50" y="20" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">Natural Gas</text>
    <text x="50" y="36" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">CH4 + H2S</text>
  </g>
  <line x1="125" y1="113" x2="160" y2="113" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="158,107 172,113 158,119" fill="#34d399"/>

  <!-- Desulfurizer -->
  <g transform="translate(175, 86)">
    <rect width="115" height="54" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#pfSh)"/>
    <text x="57" y="20" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">Desulfurizer</text>
    <text x="57" y="36" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">ZnO Guard Bed</text>
    <text x="57" y="50" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">H2S removed</text>
  </g>
  <line x1="295" y1="113" x2="330" y2="113" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="328,107 342,113 328,119" fill="#34d399"/>

  <!-- Reformer -->
  <g transform="translate(345, 80)">
    <rect width="135" height="66" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2" filter="url(#pfSh)"/>
    <text x="67" y="20" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">Steam Reformer</text>
    <text x="67" y="38" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">700-900 C</text>
    <text x="67" y="54" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">CH4 + H2O = CO + 3H2</text>
  </g>

  <!-- Steam to reformer -->
  <g transform="translate(378, 170)">
    <rect width="68" height="32" rx="9" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="34" y="14" font-family="sans-serif" font-size="10" fill="#22d3ee" text-anchor="middle" font-weight="600">Steam</text>
    <text x="34" y="27" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">H2O</text>
  </g>
  <line x1="412" y1="167" x2="412" y2="150" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="406,153 412,141 418,153" fill="#06b6d4"/>

  <!-- Syngas arrow -->
  <line x1="485" y1="113" x2="520" y2="113" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="518,107 532,113 518,119" fill="#f59e0b"/>
  <text x="508" y="104" font-family="sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">Syngas</text>

  <!-- Compressor -->
  <g transform="translate(535, 90)">
    <rect width="95" height="46" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2" filter="url(#pfSh)"/>
    <text x="47" y="20" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">Compressor</text>
    <text x="47" y="36" font-family="sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle">to 80 bar</text>
  </g>
  <line x1="635" y1="113" x2="675" y2="113" stroke="#60a5fa" stroke-width="2.5"/>
  <polygon points="673,107 687,113 673,119" fill="#60a5fa"/>

  <!-- Synthesis Reactor -->
  <g transform="translate(690, 76)">
    <rect width="160" height="78" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="3" filter="url(#pfSh)"/>
    <text x="80" y="20" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">Synthesis Reactor</text>
    <text x="80" y="36" font-family="sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle">ICI 4-Bed Quench</text>
    <text x="80" y="52" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle" font-weight="600">CO + 2H2 = CH3OH</text>
    <text x="80" y="68" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">250C / 80 bar / LHHW</text>
  </g>
  <line x1="855" y1="113" x2="895" y2="113" stroke="#3b82f6" stroke-width="2.5"/>
  <polygon points="893,107 907,113 893,119" fill="#3b82f6"/>

  <!-- Separator -->
  <g transform="translate(910, 86)">
    <rect width="108" height="54" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2" filter="url(#pfSh)"/>
    <text x="54" y="20" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">Separator</text>
    <text x="54" y="36" font-family="sans-serif" font-size="9" fill="#c084fc" text-anchor="middle">Gas/Liquid Split</text>
    <text x="54" y="50" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Flash @ 30 bar</text>
  </g>

  <!-- === ROW 2: Down to distillation (y=270 center) === -->

  <!-- Separator down to Distillation -->
  <line x1="964" y1="145" x2="964" y2="220" stroke="#c084fc" stroke-width="2.5"/>
  <polygon points="958,218 964,232 970,218" fill="#c084fc"/>
  <text x="980" y="190" font-family="sans-serif" font-size="9" fill="#c084fc">Crude MeOH</text>

  <!-- Distillation -->
  <g transform="translate(880, 235)">
    <rect width="168" height="82" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" filter="url(#pfSh)"/>
    <text x="84" y="20" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">Distillation Column</text>
    <text x="84" y="38" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Reflux 3.0 / Reboiler 50 kW</text>
    <text x="84" y="56" font-family="sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="600">99.85% Purity</text>
    <text x="84" y="72" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">(Grade AA)</text>
  </g>

  <!-- Water output (left) -->
  <line x1="876" y1="286" x2="820" y2="286" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="822,280 808,286 822,292" fill="#06b6d4"/>
  <g transform="translate(738, 270)">
    <rect width="68" height="32" rx="9" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="34" y="21" font-family="sans-serif" font-size="10" fill="#22d3ee" text-anchor="middle">Water</text>
  </g>

  <!-- Product output (down) -->
  <line x1="964" y1="322" x2="964" y2="360" stroke="#10b981" stroke-width="3"/>
  <polygon points="958,358 964,372 970,358" fill="#10b981"/>
  <g transform="translate(874, 375)">
    <rect width="180" height="60" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.5" filter="url(#pfSh)"/>
    <text x="90" y="22" font-family="sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="700">Pure Methanol</text>
    <text x="90" y="40" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">CH3OH (Grade AA)</text>
    <text x="90" y="54" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">$740/MT - Asia Pacific</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(20, 245)">
    <rect width="270" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="15" y="20" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="700">LEGEND</text>
    <line x1="15" y1="36" x2="40" y2="36" stroke="#34d399" stroke-width="2.5"/>
    <polygon points="38,31 50,36 38,41" fill="#34d399"/>
    <text x="60" y="40" font-family="sans-serif" font-size="10" fill="#94a3b8">Process flow</text>
    <line x1="15" y1="54" x2="40" y2="54" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="60" y="58" font-family="sans-serif" font-size="10" fill="#94a3b8">Recycle stream</text>
    <line x1="15" y1="72" x2="40" y2="72" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="25,68 15,72 25,76" fill="#ef4444"/>
    <text x="60" y="76" font-family="sans-serif" font-size="10" fill="#94a3b8">Purge / waste</text>
    <line x1="15" y1="90" x2="40" y2="90" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="60" y="94" font-family="sans-serif" font-size="10" fill="#94a3b8">Utilities (steam, water)</text>
    <rect x="15" y="106" width="16" height="12" rx="3" fill="#f59e0b" opacity="0.5"/>
    <text x="60" y="116" font-family="sans-serif" font-size="10" fill="#94a3b8">Catalyst bed</text>
  </g>

  <!-- KEY NUMBERS -->
  <g transform="translate(310, 245)">
    <rect width="270" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="15" y="20" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="700">KEY PROCESS NUMBERS</text>
    <g font-family="sans-serif" font-size="10" fill="#94a3b8">
      <text x="15" y="40"><tspan fill="#34d399" font-weight="600">Feed: </tspan>H2 0-10, CO 0-5 mol/s</text>
      <text x="15" y="56"><tspan fill="#f59e0b" font-weight="600">SMR: </tspan>700-900 C, S/C ~ 3.0</text>
      <text x="15" y="72"><tspan fill="#60a5fa" font-weight="600">Reactor: </tspan>250 C, 50-100 bar</text>
      <text x="15" y="88"><tspan fill="#c084fc" font-weight="600">Selectivity: </tspan>&gt;99.8%</text>
      <text x="15" y="104"><tspan fill="#ef4444" font-weight="600">Safety: </tspan>Shutdown @ 300 C</text>
      <text x="15" y="120"><tspan fill="#10b981" font-weight="600">Product: </tspan>Grade AA (99.85%)</text>
    </g>
  </g>

  <!-- AGENT CONTROLS -->
  <g transform="translate(600, 245)">
    <rect width="220" height="74" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="15" y="20" font-family="sans-serif" font-size="11" fill="#60a5fa" font-weight="700">RL AGENT CONTROLS</text>
    <text x="15" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8">13 variables across all stages</text>
    <text x="15" y="54" font-family="sans-serif" font-size="9" fill="#fbbf24">Single-pass conversion ~5%</text>
    <text x="15" y="68" font-family="sans-serif" font-size="9" fill="#94a3b8">Recycle makes up difference</text>
  </g>
</svg>