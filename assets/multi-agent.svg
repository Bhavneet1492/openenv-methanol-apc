<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="supGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="refGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="synGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="purGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.45"/>
    </filter>

    <marker id="arrowCmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowObs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>

    <style>
      @keyframes dash { to { stroke-dashoffset: -24; } }
      .cmd { stroke-dasharray: 8 6; animation: dash 2.4s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="600" y="46" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700" letter-spacing="0.6">FOUR-AGENT SUPERVISORY ARCHITECTURE</text>
  <text x="600" y="70" font-size="13" fill="#94a3b8" text-anchor="middle">Each agent owns a plant subsystem · Supervisor merges actions and resolves conflicts · 4 MCP tools provide context</text>

  <!-- ============ SUPERVISORY AGENT ============ -->
  <g filter="url(#shadow)">
    <rect x="430" y="100" width="340" height="120" rx="14" fill="url(#supGrad)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="465" cy="135" r="14" fill="#22d3ee" opacity="0.25"/>
    <circle cx="465" cy="135" r="7" fill="#67e8f9"/>
    <text x="490" y="140" font-size="18" font-weight="700" fill="#ffffff">SupervisoryAgent</text>
    <text x="450" y="170" font-size="12" fill="#cffafe">plant-wide view · merge_actions() · MCP-aware</text>
    <text x="450" y="190" font-size="12" fill="#a5f3fc">resolves profit ↔ safety ↔ catalyst-life conflicts</text>
    <text x="450" y="208" font-size="11" fill="#67e8f9" font-style="italic">policy: Qwen2.5-3B  ·  trainer: GRPO</text>
  </g>

  <!-- ============ MCP TOOLS (right of supervisor) ============ -->
  <g>
    <text x="820" y="115" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="0.6">MCP TOOLS</text>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#e2e8f0">
      <rect x="820" y="125" width="320" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="836" y="144">⚡  get_energy_pricing()</text>

      <rect x="820" y="158" width="320" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="836" y="177">🛡  get_catalyst_status()</text>

      <rect x="820" y="191" width="320" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="836" y="210">🔧  get_maintenance_schedule()</text>

      <rect x="820" y="224" width="320" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="836" y="243">🌍  calculate_carbon_footprint()</text>
    </g>
    <!-- connector from MCP block to supervisor -->
    <path d="M 820,184 L 790,184 L 790,160 L 770,160" stroke="#475569" stroke-width="1.5" fill="none"/>
  </g>

  <!-- ============ COMMAND ARROWS (Supervisor → 3 sub-agents) ============ -->
  <g fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
    <path d="M 510,220 Q 420,300 250,395" class="cmd" marker-end="url(#arrowCmd)"/>
    <path d="M 600,220 L 600,395"          class="cmd" marker-end="url(#arrowCmd)"/>
    <path d="M 690,220 Q 780,300 950,395" class="cmd" marker-end="url(#arrowCmd)"/>
  </g>

  <!-- Observation back-channels (subtle dashed gray) -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7">
    <path d="M 280,395 Q 430,310 540,225"  marker-end="url(#arrowObs)"/>
    <path d="M 620,395 L 620,225"           marker-end="url(#arrowObs)"/>
    <path d="M 920,395 Q 770,310 660,225"   marker-end="url(#arrowObs)"/>
  </g>

  <!-- channel labels -->
  <text x="365" y="305" font-size="11" fill="#22d3ee" font-weight="600">action ↘</text>
  <text x="365" y="322" font-size="11" fill="#94a3b8">↖ observation</text>
  <text x="780" y="305" font-size="11" fill="#22d3ee" font-weight="600" text-anchor="end">↙ action</text>
  <text x="780" y="322" font-size="11" fill="#94a3b8" text-anchor="end">observation ↗</text>

  <!-- ============ SUB-AGENTS (flat panels) ============ -->

  <!-- REFORMER (left) -->
  <g filter="url(#shadow)">
    <rect x="80" y="395" width="320" height="170" rx="14" fill="url(#refGrad)" stroke="#fb923c" stroke-width="2"/>
    <text x="100" y="430" font-size="17" fill="#ffffff" font-weight="700">🟠  ReformerAgent</text>
    <line x1="100" y1="442" x2="380" y2="442" stroke="#fb923c" stroke-opacity="0.4"/>
    <text x="100" y="465" font-size="11" fill="#fed7aa" font-weight="600" letter-spacing="0.5">CONTROLS</text>
    <text x="100" y="484" font-size="12" fill="#fff7ed" font-family="'JetBrains Mono', Consolas, monospace">reformer_fuel_gas</text>
    <text x="100" y="502" font-size="12" fill="#fff7ed" font-family="'JetBrains Mono', Consolas, monospace">reformer_steam_flow</text>
    <text x="100" y="535" font-size="11" fill="#fdba74" font-weight="600" letter-spacing="0.5">REACTION</text>
    <text x="100" y="554" font-size="12" fill="#ffedd5">CH₄ + H₂O → CO + 3H₂   (S/C ≈ 3.0)</text>
  </g>

  <!-- SYNTHESIS (centre) -->
  <g filter="url(#shadow)">
    <rect x="440" y="395" width="320" height="170" rx="14" fill="url(#synGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="460" y="430" font-size="17" fill="#ffffff" font-weight="700">🔵  SynthesisAgent</text>
    <line x1="460" y1="442" x2="740" y2="442" stroke="#60a5fa" stroke-opacity="0.4"/>
    <text x="460" y="465" font-size="11" fill="#bfdbfe" font-weight="600" letter-spacing="0.5">CONTROLS</text>
    <text x="460" y="484" font-size="12" fill="#eff6ff" font-family="'JetBrains Mono', Consolas, monospace">feed_h2 · feed_co · cooling</text>
    <text x="460" y="502" font-size="12" fill="#eff6ff" font-family="'JetBrains Mono', Consolas, monospace">compressor · purge · recycle</text>
    <text x="460" y="535" font-size="11" fill="#93c5fd" font-weight="600" letter-spacing="0.5">REACTION</text>
    <text x="460" y="554" font-size="12" fill="#dbeafe">CO + 2H₂ → CH₃OH   (240–260 °C, 50–80 bar)</text>
  </g>

  <!-- PURIFICATION (right) -->
  <g filter="url(#shadow)">
    <rect x="800" y="395" width="320" height="170" rx="14" fill="url(#purGrad)" stroke="#c084fc" stroke-width="2"/>
    <text x="820" y="430" font-size="17" fill="#ffffff" font-weight="700">🟣  PurificationAgent</text>
    <line x1="820" y1="442" x2="1100" y2="442" stroke="#c084fc" stroke-opacity="0.4"/>
    <text x="820" y="465" font-size="11" fill="#e9d5ff" font-weight="600" letter-spacing="0.5">CONTROLS</text>
    <text x="820" y="484" font-size="12" fill="#faf5ff" font-family="'JetBrains Mono', Consolas, monospace">distillation_reflux</text>
    <text x="820" y="502" font-size="12" fill="#faf5ff" font-family="'JetBrains Mono', Consolas, monospace">reboiler_duty</text>
    <text x="820" y="535" font-size="11" fill="#d8b4fe" font-weight="600" letter-spacing="0.5">OUTPUT</text>
    <text x="820" y="554" font-size="12" fill="#f3e8ff">Grade AA methanol   (purity &gt; 99.85%)</text>
  </g>

  <!-- ============ ACTION ARROWS (sub-agents → plant) ============ -->
  <g fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round">
    <path d="M 240,565 L 240,615" marker-end="url(#arrowAct)"/>
    <path d="M 600,565 L 600,615" marker-end="url(#arrowAct)"/>
    <path d="M 960,565 L 960,615" marker-end="url(#arrowAct)"/>
  </g>

  <!-- ============ PLANT BUSBAR ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="615" width="1080" height="58" rx="12" fill="url(#plantGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="84" y="641" font-size="13" fill="#a7f3d0" font-weight="700" letter-spacing="0.6">PLANT  ·  env.step()</text>
    <text x="84" y="660" font-size="11" fill="#6ee7b7">5 stages · 13 continuous controls · 30+ observations · physics: LHHW · SRK · RK4 · Ergun</text>
    <g font-size="14" fill="#a7f3d0">
      <text x="980" y="650">⚙</text>
      <text x="1004" y="650">🔥</text>
      <text x="1028" y="650">🌬</text>
      <text x="1052" y="650">💧</text>
      <text x="1076" y="650">⚗</text>
      <text x="1100" y="650">📦</text>
    </g>
  </g>

  <!-- ============ LEGEND (bottom-left, below sub-agents) ============ -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="240" height="92" rx="8" fill="#0b1224" fill-opacity="0.75" stroke="#1e293b"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.6">LEGEND</text>

    <line x1="14" y1="38" x2="46" y2="38" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="54" y="42" font-size="11" fill="#cbd5e1">command  (sup → agent)</text>

    <line x1="14" y1="58" x2="46" y2="58" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="54" y="62" font-size="11" fill="#cbd5e1">observation back-channel</text>

    <line x1="14" y1="78" x2="46" y2="78" stroke="#10b981" stroke-width="2.2"/>
    <text x="54" y="82" font-size="11" fill="#cbd5e1">action → env.step()</text>
  </g>
</svg>
