<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720">
  <defs>
    <linearGradient id="maBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>

    <!-- Supervisory (cyan / 🔷) -->
    <linearGradient id="supTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="supSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>

    <!-- Reformer (orange / 🟠) -->
    <linearGradient id="refTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="refSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Synthesis (blue / 🔵) -->
    <linearGradient id="synTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="synSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Purification (purple / 🟣) -->
    <linearGradient id="purTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="purSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- MCP tool chip -->
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="maShadow">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="cmdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee" opacity="0.85"/>
    </marker>
    <marker id="obsArrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#94a3b8" opacity="0.7"/>
    </marker>

    <style>
      @keyframes pulseLine { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -24; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .cmd-line { stroke-dasharray: 8 6; animation: pulseLine 2.4s linear infinite; }
      .float { animation: float 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="url(#maBg)" rx="16"/>

  <!-- Title -->
  <text x="550" y="40" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="700" letter-spacing="0.5">FOUR-AGENT SUPERVISORY ARCHITECTURE</text>
  <text x="550" y="62" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Each agent owns a plant subsystem · Supervisory merges actions and resolves conflicts · 4 MCP tools provide context</text>

  <!-- ============ SUPERVISORY AGENT (top, isometric box) ============ -->
  <g transform="translate(400, 100)" filter="url(#maShadow)" class="float">
    <!-- isometric box: top + front + side -->
    <polygon points="0,40 150,0 300,40 150,80" fill="url(#supTop)" stroke="#22d3ee" stroke-width="1"/>
    <polygon points="0,40 0,140 150,180 150,80" fill="url(#supSide)" stroke="#155e75" stroke-width="1"/>
    <polygon points="300,40 300,140 150,180 150,80" fill="#0e7490" stroke="#155e75" stroke-width="1"/>

    <!-- Glowing core / hologram dot -->
    <circle cx="150" cy="90" r="14" fill="#67e8f9" opacity="0.85" filter="url(#softGlow)"/>
    <circle cx="150" cy="90" r="6" fill="#ecfeff"/>

    <!-- Label -->
    <text x="150" y="120" font-family="'Segoe UI', sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="700">SupervisoryAgent</text>
    <text x="150" y="140" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cffafe" text-anchor="middle">plant-wide view · merge_actions() · MCP-aware</text>
    <text x="150" y="158" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a5f3fc" text-anchor="middle" opacity="0.9">resolves profit ↔ safety ↔ catalyst-life conflicts</text>
  </g>

  <!-- MCP tool strip (right of supervisor) -->
  <g transform="translate(770, 110)">
    <text x="0" y="-8" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="0.5">MCP TOOLS</text>
    <g>
      <rect x="0" y="0" width="220" height="32" rx="6" fill="url(#mcpGrad)" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">⚡ get_energy_pricing()</text>
    </g>
    <g transform="translate(0, 38)">
      <rect width="220" height="32" rx="6" fill="url(#mcpGrad)" stroke="#334155"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">🛡 get_catalyst_status()</text>
    </g>
    <g transform="translate(0, 76)">
      <rect width="220" height="32" rx="6" fill="url(#mcpGrad)" stroke="#334155"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">🔧 get_maintenance_schedule()</text>
    </g>
    <g transform="translate(0, 114)">
      <rect width="220" height="32" rx="6" fill="url(#mcpGrad)" stroke="#334155"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">🌍 calculate_carbon_footprint()</text>
    </g>
    <!-- bracket connecting MCP -->
    <line x1="-15" y1="16" x2="-15" y2="130" stroke="#334155" stroke-width="2"/>
    <line x1="-15" y1="16" x2="-5" y2="16" stroke="#334155" stroke-width="2"/>
    <line x1="-15" y1="130" x2="-5" y2="130" stroke="#334155" stroke-width="2"/>
    <line x1="-15" y1="73" x2="-25" y2="73" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- ============ COMMAND LINES (Supervisor → 3 sub-agents) ============ -->
  <g stroke-linecap="round" fill="none">
    <!-- to Reformer -->
    <path d="M 480,260 Q 350,330 220,420" stroke="#22d3ee" stroke-width="2.5" class="cmd-line" marker-end="url(#cmdArrow)" opacity="0.8"/>
    <!-- to Synthesis -->
    <path d="M 550,260 L 550,420" stroke="#22d3ee" stroke-width="2.5" class="cmd-line" marker-end="url(#cmdArrow)" opacity="0.8"/>
    <!-- to Purification -->
    <path d="M 620,260 Q 750,330 880,420" stroke="#22d3ee" stroke-width="2.5" class="cmd-line" marker-end="url(#cmdArrow)" opacity="0.8"/>
  </g>

  <!-- Observation back-channel (subtle) -->
  <g stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M 200,440 Q 330,355 470,275" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#obsArrow)"/>
    <path d="M 540,440 L 540,275" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#obsArrow)"/>
    <path d="M 900,440 Q 770,355 630,275" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#obsArrow)"/>
  </g>
  <text x="780" y="335" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" opacity="0.8">↘ obs / ↗ action</text>

  <!-- ============ SUB-AGENTS (isometric boxes) ============ -->

  <!-- REFORMER (left) -->
  <g transform="translate(80, 420)" filter="url(#maShadow)">
    <polygon points="0,30 130,0 260,30 130,60" fill="url(#refTop)" stroke="#fb923c" stroke-width="1"/>
    <polygon points="0,30 0,140 130,170 130,60" fill="url(#refSide)" stroke="#9a3412"/>
    <polygon points="260,30 260,140 130,170 130,60" fill="#9a3412" stroke="#9a3412"/>
    <text x="130" y="100" font-family="'Segoe UI', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">🟠 ReformerAgent</text>
    <text x="130" y="120" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fed7aa" text-anchor="middle">reformer_fuel_gas</text>
    <text x="130" y="135" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fed7aa" text-anchor="middle">reformer_steam_flow</text>
    <text x="130" y="155" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fdba74" text-anchor="middle" opacity="0.9">CH₄ + H₂O → CO + 3H₂  (S/C ≈ 3.0)</text>
  </g>

  <!-- SYNTHESIS (centre) -->
  <g transform="translate(420, 420)" filter="url(#maShadow)">
    <polygon points="0,30 130,0 260,30 130,60" fill="url(#synTop)" stroke="#60a5fa" stroke-width="1"/>
    <polygon points="0,30 0,140 130,170 130,60" fill="url(#synSide)" stroke="#1e3a8a"/>
    <polygon points="260,30 260,140 130,170 130,60" fill="#1e3a8a" stroke="#1e3a8a"/>
    <text x="130" y="100" font-family="'Segoe UI', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">🔵 SynthesisAgent</text>
    <text x="130" y="120" font-family="'JetBrains Mono', monospace" font-size="10" fill="#bfdbfe" text-anchor="middle">feed_h2 · feed_co · cooling</text>
    <text x="130" y="135" font-family="'JetBrains Mono', monospace" font-size="10" fill="#bfdbfe" text-anchor="middle">compressor · purge · recycle</text>
    <text x="130" y="155" font-family="'Segoe UI', sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle" opacity="0.9">CO + 2H₂ → CH₃OH  (240–260 °C, 50–80 bar)</text>
  </g>

  <!-- PURIFICATION (right) -->
  <g transform="translate(760, 420)" filter="url(#maShadow)">
    <polygon points="0,30 130,0 260,30 130,60" fill="url(#purTop)" stroke="#c084fc" stroke-width="1"/>
    <polygon points="0,30 0,140 130,170 130,60" fill="url(#purSide)" stroke="#581c87"/>
    <polygon points="260,30 260,140 130,170 130,60" fill="#581c87" stroke="#581c87"/>
    <text x="130" y="100" font-family="'Segoe UI', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">🟣 PurificationAgent</text>
    <text x="130" y="120" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e9d5ff" text-anchor="middle">distillation_reflux</text>
    <text x="130" y="135" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e9d5ff" text-anchor="middle">reboiler_duty</text>
    <text x="130" y="155" font-family="'Segoe UI', sans-serif" font-size="9" fill="#d8b4fe" text-anchor="middle" opacity="0.9">Grade AA methanol  (purity &gt; 99.85 %)</text>
  </g>

  <!-- ============ PLANT BUSBAR (bottom) ============ -->
  <g transform="translate(60, 640)">
    <rect width="980" height="50" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#maShadow)"/>
    <text x="20" y="22" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a7f3d0" font-weight="700">PLANT (env.step)</text>
    <text x="20" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6ee7b7">5 stages · 13 continuous controls · 30+ observations · physics: LHHW · SRK · RK4 · Ergun</text>
    <!-- icons -->
    <g transform="translate(700, 25)" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a7f3d0">
      <text x="0">⚙</text><text x="22">🔥</text><text x="44">🌬</text><text x="66">💧</text><text x="88">⚗</text><text x="110">📦</text>
    </g>
  </g>

  <!-- Down arrows from agents to plant -->
  <g stroke="#10b981" stroke-width="2" fill="none" opacity="0.7" marker-end="url(#cmdArrow)">
    <path d="M 210,600 L 210,640" />
    <path d="M 550,600 L 550,640" />
    <path d="M 890,600 L 890,640" />
  </g>

  <!-- Legend -->
  <g transform="translate(60, 100)" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
    <text font-weight="700" fill="#e2e8f0" font-size="11">LEGEND</text>
    <g transform="translate(0, 18)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6 4"/>
      <text x="26" y="3">command (sup → agent)</text>
    </g>
    <g transform="translate(0, 36)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 4"/>
      <text x="26" y="3">observation back-channel</text>
    </g>
    <g transform="translate(0, 54)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#10b981" stroke-width="2"/>
      <text x="26" y="3">action → env.step()</text>
    </g>
  </g>
</svg>
